image: freebsd/latest
packages: [
  # build
  autoconf, automake, libtool, pkgconf, dejagnu,
  # libs
  readline, zh-librime, zh-libpinyin,
]
sources:
  - https://git.sr.ht/~cismonx/arif
environment:
  cflags: >-
    -O0 -g -std=c99 -Wall -Wextra -Wpedantic -Wshadow
    -fsanitize=address,undefined -fno-sanitize-recover
  cppflags: -D_POSIX_C_SOURCE=200112L
tasks:
  - setup: |
      mkdir arif/build && cd arif/build
      autoreconf -i ..
      ../configure --enable-arif-debug --enable-rlexec  \
          --enable-arif-rime --enable-arif-pinyin       \
          CFLAGS="$cflags" CPPFLAG="$cppflags"
  - build: |
      cd arif/build
      make
  - test: |
      cd arif/build
      make check

# For history builds, see:
# - <https://builds.sr.ht/~cismonx/arif/commits/master/freebsd.yml>
